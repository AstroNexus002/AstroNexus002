<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AstroNexus — exploring the universe of code">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f2a"/>
      <stop offset="55%" stop-color="#1a1147"/>
      <stop offset="100%" stop-color="#2b0f3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#c084fc;#f472b6;#7dd3fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#7dd3fc;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .6s; } .s3 { animation-delay: 1.2s; }
      .s4 { animation-delay: 1.8s; } .s5 { animation-delay: 2.4s; }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      .orbit { transform-origin: 1010px 150px; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .comet { animation: fly 7s linear infinite; }
      @keyframes fly {
        0% { transform: translate(-200px, -60px); opacity: 0 }
        10% { opacity: 1 }
        40% { transform: translate(700px, 160px); opacity: 0 }
        100% { transform: translate(700px, 160px); opacity: 0 }
      }
      .title { font: 800 72px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; }
      .sub { font: 400 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 4px; }
      .fade { animation: fadein 1.6s ease-out both; }
      .fade2 { animation: fadein 1.6s ease-out .5s both; }
      @keyframes fadein { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="60" cy="40" r="1.6"/>
    <circle class="star s2" cx="140" cy="230" r="1.2"/>
    <circle class="star s3" cx="220" cy="80" r="1.8"/>
    <circle class="star s4" cx="310" cy="260" r="1.1"/>
    <circle class="star s5" cx="380" cy="30" r="1.4"/>
    <circle class="star s2" cx="470" cy="270" r="1.6"/>
    <circle class="star" cx="560" cy="50" r="1.1"/>
    <circle class="star s3" cx="640" cy="250" r="1.7"/>
    <circle class="star s4" cx="720" cy="35" r="1.3"/>
    <circle class="star s5" cx="790" cy="275" r="1.2"/>
    <circle class="star" cx="860" cy="60" r="1.8"/>
    <circle class="star s2" cx="1140" cy="40" r="1.4"/>
    <circle class="star s3" cx="1170" cy="260" r="1.6"/>
    <circle class="star s4" cx="30" cy="150" r="1.2"/>
    <circle class="star s5" cx="900" cy="250" r="1.1"/>
    <circle class="star s3" cx="1100" cy="275" r="1.3"/>
  </g>

  <!-- comet -->
  <g class="comet">
    <line x1="0" y1="0" x2="-90" y2="-22" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
  </g>

  <!-- planet with orbiting moon -->
  <circle cx="1010" cy="150" r="110" fill="url(#glow)"/>
  <ellipse cx="1010" cy="150" rx="105" ry="26" fill="none" stroke="#c4b5fd" stroke-opacity=".35" stroke-width="2" transform="rotate(-18 1010 150)"/>
  <circle cx="1010" cy="150" r="58" fill="url(#planet)"/>
  <path d="M915 178 A105 26 -18 0 0 1105 122" fill="none" stroke="#e9d5ff" stroke-opacity=".8" stroke-width="3" transform="rotate(0)"/>
  <g class="orbit">
    <circle cx="1010" cy="62" r="8" fill="#7dd3fc"/>
  </g>

  <!-- text -->
  <g class="fade">
    <text x="80" y="160" class="title" fill="url(#title)">AstroNexus</text>
  </g>
  <g class="fade2">
    <text x="84" y="205" class="sub">EXPLORING THE UNIVERSE OF CODE  ✦</text>
  </g>
</svg>
