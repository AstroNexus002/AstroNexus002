<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="AstroNexus — Senior Software Engineer, AI and Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 56px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .role { font: 500 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
      .tags { font: 400 17px 'Consolas', 'SFMono-Regular', Menlo, monospace; fill: #94a3b8; letter-spacing: 1px; }
      .in { animation: in 1.2s ease-out both; }
      .in2 { animation: in 1.2s ease-out .3s both; }
      .in3 { animation: in 1.2s ease-out .6s both; }
      @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="14" fill="url(#glow)"/>
  <rect x="72" y="62" width="6" height="136" rx="3" fill="url(#accent)"/>

  <g class="in"><text x="104" y="112" class="name">AstroNexus</text></g>
  <g class="in2"><text x="106" y="152" class="role">Senior Software Engineer · AI &amp; Full-Stack</text></g>
  <g class="in3"><text x="106" y="192" class="tags">LLM Apps  /  SaaS Platforms  /  Cloud &amp; DevOps</text></g>

  <!-- node network motif -->
  <g stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M880 70 L980 120 L1080 80 M980 120 L960 200 L1090 180 L1080 80 M960 200 L860 170 L880 70"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="880" cy="70" r="5"/>
    <circle class="pulse" cx="980" cy="120" r="7" fill="#60a5fa"/>
    <circle cx="1080" cy="80" r="5"/>
    <circle cx="960" cy="200" r="5"/>
    <circle class="pulse" cx="1090" cy="180" r="5" style="animation-delay:1.2s"/>
    <circle cx="860" cy="170" r="4"/>
  </g>
</svg>
